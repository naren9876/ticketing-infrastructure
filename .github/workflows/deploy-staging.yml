name: Deploy to Staging

on:
  push:
    branches: [main]
    paths:
      - 'terraform/staging.tfvars'
      - 'kubernetes/overlays/staging/**'
      - '.github/workflows/deploy-staging.yml'

jobs:
  provision-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Initialize Terraform
      working-directory: terraform
      run: terraform init
    
    - name: Plan Terraform changes
      working-directory: terraform
      run: terraform plan -var-file=staging.tfvars -out=tfplan
    
    - name: Apply Terraform changes
      working-directory: terraform
      run: terraform apply -auto-approve tfplan
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: '1.36'
    
    - name: Update kubeconfig for staging cluster
      env:
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: aws eks update-kubeconfig --name ticketing-staging --region ${{ secrets.AWS_REGION }}
    
    - name: Deploy ArgoCD Application for staging
      run: |
        aws eks update-kubeconfig --name ticketing-dev --region ${{ secrets.AWS_REGION }}
        kubectl apply -f kubernetes/argocd/staging-application.yaml -n argocd
    
    - name: Verify staging deployment
      run: |
        kubectl get deployments -n default
        kubectl get pods -n default
        kubectl get svc -n default
