# ==================== AI Model Serving with KServe ====================
# Simplified for dev environment - CPU only, no GPU

---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-models

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-server
  namespace: ai-models

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: ai-models
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
# Recommendation Model
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: recommendation-model
  namespace: ai-models
spec:
  predictor:
    containers:
    - name: kserve-container
      image: python:3.11
      ports:
      - containerPort: 8080
        protocol: TCP
      env:
      - name: MODEL_PATH
        value: /mnt/models/recommendation/model.pkl
      - name: BATCH_SIZE
        value: "32"
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      livenessProbe:
        httpGet:
          path: /v1/models/recommendation:predict
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /v1/models/recommendation:predict
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5
    serviceAccountName: model-server
    volumes:
    - name: model-storage
      persistentVolumeClaim:
        claimName: models-pvc

